name: Deploy NGO FE Onsite

on:
  push:
    branches:
      - prod
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: ngo-fe-onsite-production
  cancel-in-progress: false

env:
  APP_NAME: ngo-fe-onsite
  APP_ROOT: /home/ec2-user/ngo-fe-onsite
  APP_PORT: "3000"

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate production API URL
        run: |
          if [ -z "${NEXT_PUBLIC_API_BASE_URL}" ]; then
            echo "NEXT_PUBLIC_API_BASE_URL is not configured in GitHub Actions Variables."
            exit 1
          fi
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}

      - name: Prepare deployment package
        run: |
          set -euo pipefail

          test -f .next/standalone/server.js

          mkdir -p deploy-package/.next
          cp -a .next/standalone/. deploy-package/

          # Do not deploy local environment files.
          rm -f deploy-package/.env deploy-package/.env.local

          cp -a .next/static deploy-package/.next/static

          if [ -d public ]; then
            cp -a public deploy-package/public
          fi

          tar -czf ngo-fe-onsite.tar.gz -C deploy-package .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload artifact to S3
        run: |
          aws s3 cp ngo-fe-onsite.tar.gz \
            "s3://${{ vars.S3_BUCKET }}/releases/${{ github.sha }}.tar.gz"

      - name: Deploy on EC2 through SSM
        shell: bash
        run: |
          set -euo pipefail

          RELEASE="${GITHUB_SHA}"
          BUCKET="${{ vars.S3_BUCKET }}"
          INSTANCE="${{ vars.EC2_INSTANCE_ID }}"

          cat > remote-deploy.sh <<'REMOTE'
          #!/bin/bash
          set -euo pipefail

          APP_ROOT="/home/ec2-user/ngo-fe-onsite"
          RELEASE_DIR="$APP_ROOT/releases/RELEASE_PLACEHOLDER"
          PREVIOUS="$(readlink -f "$APP_ROOT/current" 2>/dev/null || true)"

          # Create the releases parent directory before the release directory.
          mkdir -p "$APP_ROOT/releases"
          mkdir -p "$RELEASE_DIR"

          aws s3 cp \
            "s3://BUCKET_PLACEHOLDER/releases/RELEASE_PLACEHOLDER.tar.gz" \
            /tmp/ngo-fe-onsite.tar.gz

          tar -xzf /tmp/ngo-fe-onsite.tar.gz -C "$RELEASE_DIR"
          chown -R ec2-user:ec2-user "$RELEASE_DIR"

          # Stop the previous PM2 process before starting the new release.
          sudo -u ec2-user -H pm2 delete ngo-fe-onsite || true

          sudo -u ec2-user -H bash -c \
            "cd '$RELEASE_DIR' && PORT=3000 pm2 start server.js --name ngo-fe-onsite"

          HEALTHY=0
          for i in $(seq 1 20); do
            if node -e 'fetch("http://127.0.0.1:3000/").then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))'; then
              HEALTHY=1
              break
            fi
            sleep 3
          done

          if [ "$HEALTHY" -ne 1 ]; then
            echo "New release failed health check."
            sudo -u ec2-user -H pm2 delete ngo-fe-onsite || true

            if [ -n "$PREVIOUS" ] && [ -d "$PREVIOUS" ]; then
              ln -sfn "$PREVIOUS" "$APP_ROOT/current"
              chown -h ec2-user:ec2-user "$APP_ROOT/current"

              sudo -u ec2-user -H bash -c \
                "cd '$PREVIOUS' && PORT=3000 pm2 start server.js --name ngo-fe-onsite"

              sudo -u ec2-user -H pm2 save
              echo "Previous release restored."
            else
              echo "No previous release is available for rollback."
            fi

            exit 1
          fi

          # Point current to the new release only after it passes the health check.
          ln -sfn "$RELEASE_DIR" "$APP_ROOT/current"
          chown -h ec2-user:ec2-user "$APP_ROOT/current"

          sudo -u ec2-user -H pm2 save

          rm -f /tmp/ngo-fe-onsite.tar.gz
          echo "Deployment successful."
          REMOTE

          sed -i \
            -e "s/RELEASE_PLACEHOLDER/${RELEASE}/g" \
            -e "s/BUCKET_PLACEHOLDER/${BUCKET}/g" \
            remote-deploy.sh

          jq -n --rawfile script remote-deploy.sh \
            '{commands: [$script]}' > commands.json

          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "$INSTANCE" \
            --document-name "AWS-RunShellScript" \
            --parameters file://commands.json \
            --timeout-seconds 300 \
            --query "Command.CommandId" \
            --output text)"

          echo "SSM Command ID: $COMMAND_ID"

          for i in {1..36}; do
            STATUS="$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE" \
              --query "Status" \
              --output text 2>/dev/null || true)"

            echo "Deployment status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              exit 0
            fi

            if [[ "$STATUS" == "Failed" || "$STATUS" == "Cancelled" || "$STATUS" == "TimedOut" ]]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE" \
                --output json
              exit 1
            fi

            sleep 10
          done

          echo "Timed out while waiting for the SSM deployment command."
          exit 1
